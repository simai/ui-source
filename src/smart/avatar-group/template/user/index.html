<div class="sf-avatar sf-avatar--user">
    <img src="<%=data.imageUrl%>">
    <div class="sf-avatar--user-description">
        <span class="sf-avatar--name">
            <%= data.name%>
        </span>
        <span class="sf-avatar--additional">
            <smart
                name="icons"
                sf-code="icons"
                property = '{"styles": "regular"}'
                data='{"icon": "link"}'
                >
            </smart>
            <span><%=data.source%> </span>
        </span>
    </div>
    </div>
