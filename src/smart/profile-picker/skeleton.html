<!-- sf-profile-picker before the host's profiles arrive (standard 1.3.8
     §5.4): the folded trigger's elements and classes, settings only, the
     profile's name a bar of the same text size. No script. -->
<div class="sf-profile-picker sf-profile-picker--size-{{size}}" data-sf-static aria-hidden="true">
  <span class="sf-profile-picker-trigger">
    <i class="sf-icon sf-profile-picker-kind">person</i>
    <span class="sf-profile-picker-name">{{label}}: <span class="sf-profile-picker-skeleton-bar"></span></span>
    <i class="sf-icon sf-profile-picker-chevron">expand_more</i>
  </span>
</div>
