<!-- sf-profile-picker before the host's profiles arrive (standard 1.3.8
     §5.4): the folded trigger as the sf-button it becomes (ghost on-surface,
     the kind's glyph and a chevron; owner decision C163 (2)), settings only,
     the profile's name a bar of the same text size. No script. -->
<div class="sf-profile-picker sf-profile-picker--size-{{size}}" data-sf-static aria-hidden="true">
  <span class="sf-button sf-button--size-{{size}} sf-button--ghost sf-button--link sf-button--on-surface flex items-cross-center">
    <i class="sf-icon pointer-events-none">person</i>
    <span class="sf-button-text-container text-center pointer-events-none">{{label}}: <span class="sf-profile-picker-skeleton-bar"></span></span>
    <i class="sf-icon pointer-events-none">expand_more</i>
  </span>
</div>
