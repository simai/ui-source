# Copyright and licence of every file in this repository, in one place
# (REUSE 3.x), instead of a header in each source file: a header would change
# every built file of the distribution, and the notices already travel inside
# it (src/core/contracts/third-party-notices.v1.json). The author and sole
# rightholder is Rim Zabarov (owner decision 2026-10-23; AUTHORS, NOTICE).
version = 1
SPDX-PackageName = "SIMAI Framework"
SPDX-PackageSupplier = "Rim Zabarov <rim@zabarov.com>"
SPDX-PackageDownloadLocation = "https://github.com/simai/ui-source"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2008-2026 Rim Zabarov"
SPDX-License-Identifier = "Apache-2.0"

# Third-party files keep their own terms (THIRD_PARTY_NOTICES.md).
[[annotations]]
path = "src/core/fonts/inter/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/core/js/vendor/material-color-utilities/**"
precedence = "override"
SPDX-FileCopyrightText = "2021 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/component/icons/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# 37 of the flags are taken from flag-icons (MIT), recoloured and refitted;
# the rest are the project's own.
[[annotations]]
path = "src/component/flag/flags/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2013 Panayiotis Lipiridis"
SPDX-License-Identifier = "MIT"
