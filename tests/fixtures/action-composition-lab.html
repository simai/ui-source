<!doctype html><html lang="en" class="theme-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Action composition lab</title>
<link rel="stylesheet" href="/ui/distr/core/css/core.css"><link rel="stylesheet" href="/ui/distr/core/css/utility.full.css">
<link rel="stylesheet" href="/ui/distr/component/icons/css/icons.css"><link rel="stylesheet" href="/ui/distr/component/buttons/css/buttons.css">
<link rel="stylesheet" href="/ui/distr/component/icon-buttons/css/icon-buttons.css"><link rel="stylesheet" href="/ui/distr/component/tags/css/tags.css">
<link rel="stylesheet" href="/ui/distr/component/close/css/close.css"><link rel="stylesheet" href="/ui/distr/component/inputs/css/inputs.css"><link rel="stylesheet" href="/ui/distr/component/badges/css/badges.css"><link rel="stylesheet" href="/ui/distr/component/progress-scale/css/progress-scale.css">
<style>body{margin:0;padding:24px;font-family:var(--sf-text--family);background:var(--sf-surface-0);color:var(--sf-on-surface)} .row{display:flex;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}</style>
</head><body><main id="lab"></main>
<script>
const S=['1/3','1/2','1','2','3'], rows=[];
for (const s of S) {
  rows.push(`<div class="row" data-size="${s}">
  ${['1/2','1','2'].includes(s) ? `<label class="sf-input sf-input--size-${s} sf-input--bordered flex flex-col" data-lab="input ${s}" style="width:200px"><span class="sf-input-field items-cross-center transition flex"><span class="sf-input-left flex"><i class="sf-icon" aria-hidden="true">search</i></span><input type="text" value="Value"></span></label>` : ''}
  <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-${s}" data-lab="button text ${s}"><span class="sf-button-text-container">Save</span></button>
  <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-${s}" data-lab="button icon ${s}"><i class="sf-icon" aria-hidden="true">add</i><span class="sf-button-text-container">Add</span></button>
  <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-${s}" data-lab="button icon-right ${s}"><span class="sf-button-text-container">Next</span><i class="sf-icon" aria-hidden="true">arrow_forward</i></button>
  <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--default sf-icon-button--primary sf-icon-button--size-${s}" data-lab="icon-button ${s}" aria-label="Add"><i class="sf-icon" aria-hidden="true">add</i></button>
  ${['1/2','1','2'].includes(s) ? `<span class="sf-badge sf-badge--main sf-badge--neutral sf-badge--size-1/3 sf-badge--line-${s} flex flex-row flex-nowrap justify-center items-center" data-lab="line badge ${s}"><span class="sf-badge-text">Published</span></span><div class="sf-progress-scale sf-progress-scale--size-1 sf-progress-scale--line-${s} sf-progress-scale--40 flex flex-row items-cross-center" style="inline-size:120px" data-lab="line scale ${s}"><div class="sf-progress-scale-container grid grid-col-10 overflow-hidden">${'<div class="sf-progress-scale-block"></div>'.repeat(10)}</div><div class="sf-progress-scale-text">42%</div></div><span class="sf-tag sf-tag--default sf-tag--size-${({'1/2':'1/3','1':'1/2','2':'1'})[s]} sf-tag--inline sf-tag--line-${s} inline-flex flex-row flex-nowrap items-center" data-lab="line tag ${s}"><span class="sf-tag-container">Design</span></span>` : ''}
  ${['tonal','outline','link','surface','ghost'].map((a) => `<button type="button" class="sf-button sf-button--${a} sf-button--primary sf-button--size-${s}" data-lab="button ${a} ${s}"><span class="sf-button-text-container">${a}</span></button><button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--${a} sf-icon-button--primary sf-icon-button--size-${s}" data-lab="icon-button ${a} ${s}" aria-label="${a}"><i class="sf-icon" aria-hidden="true">add</i></button>`).join('')}
  <span class="sf-tag sf-tag--default sf-tag--size-${s} inline-flex items-center" data-lab="tag ${s}"><span class="sf-tag-container">Tag</span></span>
  <span class="sf-tag sf-tag--icon sf-tag--size-${s} inline-flex flex-row flex-nowrap items-center" data-lab="tag icon ${s}"><i class="sf-icon sf-tag-icon" aria-hidden="true">favorite</i><span class="sf-tag-container">Tag</span></span><span class="sf-tag sf-tag--color sf-tag--size-${s} inline-flex flex-row flex-nowrap items-center" data-lab="tag color ${s}"><span class="sf-tag-color-icon bg-tertiary" aria-hidden="true"></span><span class="sf-tag-container">Tag</span></span><span class="sf-tag sf-tag--default sf-tag--size-${s} sf-tag--interactive inline-flex flex-row flex-nowrap items-center" data-lab="tag count ${s}"><span class="sf-tag-container">Status</span><span class="sf-tag-count flex">12</span></span><span class="sf-tag sf-tag--default sf-tag--size-${s} sf-tag--removable inline-flex flex-row flex-nowrap items-center" data-lab="tag close ${s}"><span class="sf-tag-container">Status</span><button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--link sf-icon-button--size-1/3" aria-label="Remove"><span class="sf-close"><span class="sf-close-icon"></span></span></button></span><span class="sf-tag sf-tag--default sf-tag--size-${s} sf-tag--removable inline-flex flex-row flex-nowrap items-center" data-lab="tag count-close ${s}"><span class="sf-tag-container">Status</span><span class="sf-tag-count flex">12</span><button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--link sf-icon-button--size-1/3" aria-label="Remove"><span class="sf-close"><span class="sf-close-icon"></span></span></button></span>
  </div>`);
}
document.getElementById('lab').innerHTML = rows.join('');
document.fonts.load('24px "Material Symbols Outlined"','home').then(()=>document.querySelectorAll('.sf-icon').forEach(i=>i.classList.add('sf-icon-loaded')));
</script></body></html>
