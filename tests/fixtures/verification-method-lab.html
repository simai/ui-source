<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SF5 Verification — методическая проверка</title>
    <link rel="stylesheet" href="/source/output/theme-final-core/core/css/core.css">
    <link rel="stylesheet" href="/source/output/theme-final-core/core/css/utility.full.css">
    <link rel="stylesheet" href="/source/output/verification-current/component/verification/css/verification.css">
  </head>
  <body class="theme-light p-4">
    <main class="grid gap-4">
      <form id="code-form">
        <label class="sf-verification-form sf-verification-form--size-1" data-length="6" data-mode="numeric">
          <span class="sf-verification-form-label">Код из сообщения</span>
          <span class="sf-verification sf-verification--size-1 sf-verification--bordered">
            <input class="sf-verification-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-describedby="code-hint">
          </span>
          <span class="sf-verification-form-hint" id="code-hint">Введите шесть цифр</span>
        </label>
        <button type="reset">Сбросить</button>
      </form>

      <label class="sf-verification-form sf-verification-form--size-1" data-length="4" data-mode="alphanumeric" dir="rtl">
        <span class="sf-verification-form-label">Код RTL</span>
        <span class="sf-verification sf-verification--size-1 sf-verification--filled">
          <input class="sf-verification-input" type="text" value="A7B2" aria-label="Буквенно-цифровой код">
        </span>
      </label>

      <label class="sf-verification-form sf-verification-form--size-1 error" data-length="4">
        <span class="sf-verification-form-label">Ошибка</span>
        <span class="sf-verification sf-verification--size-1 sf-verification--bordered">
          <input class="sf-verification-input" type="text" value="0000" aria-invalid="true" aria-label="Неверный код">
        </span>
        <span class="sf-verification-form-hint">Код не подошёл</span>
      </label>
    </main>
    <script src="/source/output/verification-current/component/verification/js/verification.js"></script>
  </body>
</html>
